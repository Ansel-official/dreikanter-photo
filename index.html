<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#181818">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dreikanter photo</title>
<meta name="description" content="Dreikanter photo — 双模式平面设计与修图工作台">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/apsis.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/mobile.css">
<link rel="stylesheet" href="css/polish.css">
<link rel="stylesheet" href="css/ui-kit.css">
<link rel="stylesheet" href="css/welcome.css">
</head>
<body class="mode-ps" data-theme="dark">
<div id="app">

  <header id="topbar">
    <div class="brand" id="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M12 2.5 21 7.4v9.2L12 21.5 3 16.6V7.4z" fill="none" stroke="currentColor" stroke-width="1.3"/>
          <path d="M12 2.5v19M3 7.4l9 4.6 9-4.6" fill="none" stroke="currentColor" stroke-width="1.3" opacity=".55"/>
        </svg>
      </span>
      <b>Dreikanter</b><i>photo</i>
    </div>

    <nav id="menubar" class="menubar"></nav>

    <div class="topbar-right">
      <button class="ghost-btn" id="installBtn" title="安装到桌面" style="display:none">安装</button>
      <button class="ghost-btn menu-sheet-btn" id="menuSheetBtn" title="菜单">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <button class="ghost-btn" id="paletteBtn" title="命令面板  Ctrl/⌘ + K">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <span>命令</span><kbd>⌘K</kbd>
      </button>

      <div class="mode-switch" id="modeSwitch" role="tablist">
        <button data-mode="ps" class="active" role="tab" title="Photoshop 模式  Ctrl/⌘+Shift+M 切换">Photoshop 模式</button>
        <button data-mode="apsis" role="tab" title="Apsis 模式  Ctrl/⌘+Shift+M 切换">Apsis 模式</button>
      </div>

      <div class="win-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
  </header>

  <div id="tabbar" class="tabbar empty"></div>
  <div id="progress"><i></i></div>
  <div id="optionsbar" class="optionsbar"></div>

  <!-- Apsis 顶部：意图栏 -->
  <div id="apsisTop" class="apsis-only">
    <div class="apsis-head">
      <div class="apsis-title">
        <span class="dot"></span>
        <span id="apsisDocName">未命名</span>
        <span class="apsis-sub">指令优先 · 说出来就做</span>
      </div>
      <div class="apsis-tools">
        <button class="mini" id="apsisCustomize">自定义</button>
        <button class="mini" id="apsisHelp">手势</button>
      </div>
    </div>
    <div class="intent-wrap">
      <div class="intent-field">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.4"/></svg>
        <input id="intentInput" type="text" autocomplete="off" spellcheck="false" placeholder="输入指令：胶片感，然后裁成 16:9，加一句标题">
        <span class="intent-hint">Enter 执行</span>
      </div>
      <div class="intent-chips" id="intentChips"></div>
    </div>
  </div>

  <div id="workspace">
    <aside id="toolrail" class="toolrail"></aside>

    <main id="stagewrap">
      <div id="stage">
        <canvas id="rulerX" class="ruler"></canvas>
        <canvas id="rulerY" class="ruler"></canvas>
        <div id="rulerCorner" role="button" tabindex="0" title="标尺单位：点击切换">px</div>
        <div id="docframe">
          <canvas id="view"></canvas>
          <canvas id="overlay"></canvas>
          <div id="textEditor" contenteditable="true" spellcheck="false"></div>
        </div>
        <div id="stageHud" class="apsis-only"></div>
      </div>

      <div id="quickbar" class="apsis-only"></div>

      <div id="statusbar">
        <div class="sb-left">
          <button class="sb-btn" id="zoomOut" title="缩小">−</button>
          <span id="zoomLabel" class="sb-zoom">100%</span>
          <button class="sb-btn" id="zoomIn" title="放大">+</button>
          <span class="sb-sep"></span>
          <button class="sb-btn wide" id="zoomFit">适合屏幕</button>
          <button class="sb-btn wide" id="zoom100">100%</button>
          <button class="sb-btn wide" id="compareBtn" title="对比原图（按住 \ 键）">对比</button>
        </div>
        <div class="sb-mid" id="statusHint">就绪</div>
        <div class="sb-right">
          <span id="docDims">—</span>
          <span class="sb-sep"></span>
          <span id="cursorPos">—</span>
          <span class="sb-sep"></span>
          <span class="copyright">© Apsis severs 2026 &amp; Ansel Design 2026</span>
        </div>
      </div>
    </main>

    <aside id="panels" class="panels"></aside>

    <!-- Apsis 检查器 -->
    <aside id="inspector" class="apsis-only"></aside>
  </div>

  <div id="dock" class="apsis-only"></div>
  <div id="radial" class="apsis-only"></div>

  <div id="welcome">
    <div class="wel-top">
      <span class="wel-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.1">
          <path d="M12 2 22 7.4v9.2L12 22 2 16.6V7.4z"/><path d="M12 2v20M2 7.4l10 5.2 10-5.2" opacity=".5"/>
        </svg>
      </span>
      <span class="wel-wordmark">Dreikanter<i>photo</i></span>
      <span class="wel-build" id="welVer">v18.1</span>
      <span class="wel-grow"></span>
      <button class="wel-close" id="welClose" title="返回编辑（Esc）">返回编辑</button>
    </div>

    <div class="wel-body">
      <nav class="wel-col wel-nav" aria-label="开始">
        <div class="wel-cap">开始</div>
        <button class="wel-row" id="welNew">
          <span class="wr-ico"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2.5" y="3" width="11" height="10" rx="1"/><path d="M8 5.6v5M5.5 8.1h5"/></svg></span>
          <span class="wr-txt"><b>新建画布</b><small>尺寸 · 分辨率 · 底色</small></span>
          <kbd>Ctrl N</kbd>
        </button>
        <button class="wel-row" id="welOpen">
          <span class="wr-ico"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 5.2h4l1.4 1.8H14v6.5H2z"/><path d="M2 5.2V3.5h8"/></svg></span>
          <span class="wr-txt"><b>打开照片</b><small>拖入 / 粘贴 / JPG PNG WEBP…</small></span>
          <kbd>Ctrl O</kbd>
        </button>
        <button class="wel-row" id="welDemo">
          <span class="wr-ico"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M8 2.5 9.6 6 13 7.5 9.6 9 8 12.5 6.4 9 3 7.5 6.4 6z"/></svg></span>
          <span class="wr-txt"><b>示例作品</b><small>8 个图层，可直接拆解</small></span>
          <kbd>—</kbd>
        </button>

        <div class="wel-cap">继续</div>
        <div class="wel-resume-box" id="welResumeWrap" style="display:none">
          <button class="wel-resume" id="welResume">继续编辑</button>
          <div class="wel-resume-hint">回到当前画布</div>
        </div>
      </nav>

      <section class="wel-col wel-recent" aria-label="最近存档">
        <div class="wel-cap wel-cap-line"><span>最近存档</span><span class="wel-count" id="welRecentCount">0</span></div>
        <div class="wel-recent-list" id="welRecents"></div>
      </section>
    </div>

    <footer class="wel-foot">
      <div class="wel-formats">
        <b>JPG</b><b>PNG</b><b>WEBP</b><b>GIF</b><b>BMP</b><b>AVIF</b><b>SVG</b><b>TIFF*</b><b>HEIC*</b>
        <i>* 取决于系统解码器</i>
      </div>
      <div class="wel-legal" id="welLegal"></div>
    </footer>
  </div>

  <div id="mobileBackdrop"></div>
  <div id="mobileFab">
    <button id="mCmd" title="命令面板">⌘</button>
    <button id="mPanels" title="面板">☰</button>
  </div>
  <button class="immersive-exit" id="immersiveExit">退出沉浸模式</button>
  <div id="dropveil"><div>松手即可置入</div></div>
  <div id="modalroot"></div>
  <div id="toastroot"></div>
  <div id="srStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
</div>

<script src="js/site.js"></script>
<script src="js/util.js"></script>
<script src="js/zipkit.js"></script>
<script src="js/icons.js"></script>
<script src="js/metadata.js"></script>
<script src="js/perf.js"></script>
<script src="js/pwa.js"></script>
<script src="js/engine.js"></script>
<script src="js/docs.js"></script>
<script src="js/lut.js"></script>
<script src="js/cube.js"></script>
<script src="js/filters.js"></script>
<script src="js/tools.js"></script>
<script src="js/transform.js"></script>
<script src="js/ui.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/curves.js"></script>
<script src="js/batch.js"></script>
<script src="js/preset.js"></script>
<script src="js/localadjust.js"></script>
<script src="js/actions.js"></script>
<script src="js/compare.js"></script>
<script src="js/layerfx.js"></script>
<script src="js/guides.js"></script>
<script src="js/archive.js"></script>
<script src="js/apsis.js"></script>
<script src="js/agent.js"></script>
<script src="js/api.js"></script>
<script src="js/touch.js"></script>
<script src="js/tips.js"></script>
<script src="js/quality.js"></script>
<script src="tests/smoke.js"></script>
<script src="js/settings.js"></script>
<script src="js/main.js"></script>
</body>
</html>
