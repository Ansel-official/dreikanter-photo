name: android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 组件
        shell: pwsh
        run: |
          $sdk = "$env:ANDROID_HOME"
          if (-not $sdk) { $sdk = "$env:LOCALAPPDATA\Android\Sdk" }
          $sdkManager = Get-ChildItem "$sdk\cmdline-tools" -Recurse -Filter sdkmanager.bat -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sdkManager) { throw "找不到 sdkmanager：$sdk" }
          & $sdkManager.FullName --sdk_root="$sdk" "platforms;android-34" "build-tools;34.0.0"
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager 安装失败" }
          "ANDROID_HOME=$sdk" | Out-File -Append $env:GITHUB_ENV

      - name: 打 APK
        shell: pwsh
        run: |
          $jdk = $env:JAVA_HOME
          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { $sdk = "$env:LOCALAPPDATA\Android\Sdk" }
          powershell -ExecutionPolicy Bypass -File .\android\build.ps1 -JavaHome $jdk -Sdk $sdk

      - uses: actions/upload-artifact@v4
        with:
          name: Dreikanter-photo-android
          path: dist/android/*.apk
          if-no-files-found: error
