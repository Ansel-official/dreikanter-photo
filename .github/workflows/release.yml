name: release

# 推 v* 标签时自动出 Windows exe + Android apk，并挂到 GitHub Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '发布用的标签（例如 v18.0）'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 npm 依赖
        run: npm install --no-audit --no-fund

      - name: 打 Windows 便携版
        run: npm run dist:win

      - name: 安装 Android SDK 组件
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { $sdk = "$env:LOCALAPPDATA\Android\Sdk" }
          $sdkManager = Get-ChildItem "$sdk\cmdline-tools" -Recurse -Filter sdkmanager.bat -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sdkManager) { throw "找不到 sdkmanager：$sdk" }
          & $sdkManager.FullName --sdk_root="$sdk" "platforms;android-34" "build-tools;34.0.0"
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager 安装失败" }
          "ANDROID_HOME=$sdk" | Out-File -Append $env:GITHUB_ENV

      - name: 打 APK
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { $sdk = "$env:LOCALAPPDATA\Android\Sdk" }
          powershell -ExecutionPolicy Bypass -File .\android\build.ps1 -JavaHome $env:JAVA_HOME -Sdk $sdk

      - name: 生成发布包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\*.exe release\ -ErrorAction SilentlyContinue
          Copy-Item dist\android\*.apk release\ -ErrorAction SilentlyContinue
          Get-ChildItem release | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/*
          if-no-files-found: error

      - name: 创建 / 更新 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
