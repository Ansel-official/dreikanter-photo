name: pages

# 把仓库发布成 GitHub Pages（含应用本体 + privacy.html）
# 首次运行会用 GITHUB_TOKEN 自动开启 Pages（configure-pages 的 enablement: true）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Pages（首次自动开启）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
